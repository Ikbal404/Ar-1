<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AR Auto Box + Target</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      canvas { display: block; }
      #notification {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        font-family: sans-serif;
        font-size: 1.2em;
        color: white;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 8px;
      }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script type="module">
      import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

      // === SCENE & CAMERA ===
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // === RENDERER ===
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // === LIGHT ===
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      // === BOX ===
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.2, 0.2),
        new THREE.MeshStandardMaterial({ color: 0x44aa88 })
      );
      box.visible = false;
      scene.add(box);

      // === TARGET MARKER (TANDA) ===
      const ringGeo = new THREE.RingGeometry(0.15, 0.2, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide });
      const target = new THREE.Mesh(ringGeo, ringMat);
      target.rotation.x = -Math.PI / 2;
      target.visible = false;
      scene.add(target);

      // === NOTIFIKASI ===
      const notification = document.createElement('div');
      notification.id = 'notification';
      notification.textContent = 'Mendeteksi permukaan...';
      document.body.appendChild(notification);

      // === HIT TEST ===
      let hitTestSource = null;
      let localSpace = null;
      let hitFound = false;
      let surfaceLostTimer = 0;

      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      renderer.xr.addEventListener('sessionstart', async () => {
        const session = renderer.xr.getSession();
        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        localSpace = await session.requestReferenceSpace('local');

        session.addEventListener('end', () => {
          hitTestSource = null;
          localSpace = null;
          hitFound = false;
          box.visible = false;
          target.visible = false;
          notification.textContent = 'Sesi AR berakhir';
        });
      });

      // === ANIMASI ===
      renderer.setAnimationLoop((timestamp, frame) => {
        if (frame && hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const pose = hitTestResults[0].getPose(localSpace);
            const x = pose.transform.position.x;
            const y = pose.transform.position.y;
            const z = pose.transform.position.z;

            hitFound = true;
            surfaceLostTimer = 0;

            // Tampilkan target
            target.visible = true;
            target.position.set(x, y, z);

            // Tampilkan box (otomatis saat pertama kali ada permukaan)
            if (!box.visible) {
              box.visible = true;
              box.position.set(x, y + 0.1, z);
            } else {
              // Jika sudah muncul, posisi box ikut target
              box.position.set(x, y + 0.1, z);
            }

            notification.textContent = 'Permukaan terdeteksi ✅';
          } else {
            // Tidak ada permukaan
            if (hitFound) {
              surfaceLostTimer += 1;
              if (surfaceLostTimer > 30) { // setelah beberapa frame
                hitFound = false;
                target.visible = false;
                notification.textContent = 'Tidak ada permukaan terdeteksi ⚠️';
              }
            } else {
              notification.textContent = 'Tidak ada permukaan terdeteksi ⚠️';
              target.visible = false;
            }
          }
        }

        if (box.visible) {
          box.rotation.y += 0.01;
        }

        renderer.render(scene, camera);
      });

      // === RESIZE ===
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </head>
  <body></body>
</html>
