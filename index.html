<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AR Box + Notifikasi 3D</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      canvas { display: block; }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script type="module">
      import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

      // === SCENE & CAMERA ===
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // === RENDERER ===
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // === LIGHT ===
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      // === BOX ===
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.2, 0.2),
        new THREE.MeshStandardMaterial({ color: 0x44aa88 })
      );
      box.visible = false;
      scene.add(box);

      // === TARGET RING ===
      const ringGeo = new THREE.RingGeometry(0.15, 0.2, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide });
      const target = new THREE.Mesh(ringGeo, ringMat);
      target.rotation.x = -Math.PI / 2;
      target.visible = false;
      scene.add(target);

      // === NOTIFIKASI 3D ===
      const notifCanvas = document.createElement('canvas');
      notifCanvas.width = 512;
      notifCanvas.height = 128;
      const ctx = notifCanvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, notifCanvas.width, notifCanvas.height);
      ctx.font = 'bold 40px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText('Mendeteksi permukaan...', notifCanvas.width / 2, 80);

      const notifTexture = new THREE.CanvasTexture(notifCanvas);
      const notifMaterial = new THREE.MeshBasicMaterial({ map: notifTexture, transparent: true });
      const notifPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.2), notifMaterial);
      notifPlane.position.set(0, 0, -1);
      camera.add(notifPlane);
      scene.add(camera);

      function updateNotification(text) {
        ctx.clearRect(0, 0, notifCanvas.width, notifCanvas.height);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, notifCanvas.width, notifCanvas.height);
        ctx.font = 'bold 40px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(text, notifCanvas.width / 2, 80);
        notifTexture.needsUpdate = true;
      }

      // === HIT TEST ===
      let hitTestSource = null;
      let localSpace = null;
      let hitFound = false;
      let surfaceLostTimer = 0;

      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      renderer.xr.addEventListener('sessionstart', async () => {
        const session = renderer.xr.getSession();
        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        localSpace = await session.requestReferenceSpace('local');

        session.addEventListener('end', () => {
          hitTestSource = null;
          localSpace = null;
          hitFound = false;
          box.visible = false;
          target.visible = false;
          updateNotification('Sesi AR berakhir');
        });
      });

      // === ANIMASI ===
      renderer.setAnimationLoop((timestamp, frame) => {
        if (frame && hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const pose = hitTestResults[0].getPose(localSpace);
            const x = pose.transform.position.x;
            const y = pose.transform.position.y;
            const z = pose.transform.position.z;

            hitFound = true;
            surfaceLostTimer = 0;

            // target dan box
            target.visible = true;
            target.position.set(x, y, z);

            if (!box.visible) {
              box.visible = true;
              box.position.set(x, y + 0.1, z);
            } else {
              box.position.set(x, y + 0.1, z);
            }

            updateNotification('Permukaan terdeteksi ✅');
          } else {
            // Tidak ada permukaan
            if (hitFound) {
              surfaceLostTimer++;
              if (surfaceLostTimer > 30) {
                hitFound = false;
                target.visible = false;
                box.visible = false;
                updateNotification('Tidak ada permukaan ⚠️');
              }
            } else {
              updateNotification('Tidak ada permukaan ⚠️');
              target.visible = false;
              box.visible = false;
            }
          }
        }

        if (box.visible) {
          box.rotation.y += 0.01;
        }

        renderer.render(scene, camera);
      });

      // === RESIZE ===
      window.addEventListener('resize', () =>
