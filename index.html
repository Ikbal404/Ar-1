<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>XR Floor Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Three.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
    }

    canvas {
      display: block;
    }

    /* Gaya tombol START AR (glass iOS) */
    .ar-button {
      position: fixed !important;
      bottom: 30px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      padding: 14px 28px !important;
      font-size: 16px !important;
      font-weight: 600 !important;
      border: none !important;
      border-radius: 20px !important;
      backdrop-filter: blur(10px) !important;
      background: rgba(255, 255, 255, 0.25) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2) !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3) !important;
      outline: none !important;
      cursor: pointer !important;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .ar-button:hover {
      background: rgba(255, 255, 255, 0.35) !important;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.3) !important;
    }

    .ar-button:active {
      transform: translateX(-50%) scale(0.96) !important;
    }

    .ar-button[disabled] {
      opacity: 0.7 !important;
      background: rgba(255, 255, 255, 0.2) !important;
      color: rgba(255, 255, 255, 0.6) !important;
    }

    /* Notifikasi */
    #notif {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      z-index: 10;
      display: none;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>
  <div id="notif">🚫 Tidak ada lantai terdeteksi</div>

  <script>
    let camera, scene, renderer;
    let reticle, box;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    const notif = document.getElementById('notif');

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
      );

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Cahaya
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      // Reticle
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x00ff00 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Box (objek 3D)
      const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
      const material = new THREE.MeshPhongMaterial({ color: 0x00aaff });
      box = new THREE.Mesh(geometry, material);
      box.visible = false;
      scene.add(box);

      // Tombol AR
      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test']
      });
      arButton.textContent = 'MASUK AR 📱';
      document.body.appendChild(arButton);

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (hitTestSourceRequested === false) {
          session.requestReferenceSpace('viewer').then((referenceSpace) => {
            session.requestHitTestSource({ space: referenceSpace }).then((source) => {
              hitTestSource = source;
            });
          });

          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);

          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);

            box.visible = true;
            box.position.setFromMatrixPosition(reticle.matrix);

            notif.style.display = 'none';
          } else {
            reticle.visible = false;
            box.visible = false;
            notif.style.display = 'block';
          }
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
